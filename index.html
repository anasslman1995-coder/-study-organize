<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منظّم دراستي</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#172033}
.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:#172033;color:white;border-radius:24px;padding:22px;margin-bottom:14px}
h1,h2,p{margin-top:0}.hero p{opacity:.8;margin-bottom:0}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
button,input,textarea{font:inherit}button{min-height:44px;border:0;border-radius:13px;padding:8px 14px;cursor:pointer}.tab,.secondary{background:white;border:1px solid #dce2eb}.primary{background:#172033;color:white}
.panel{background:white;border:1px solid #e0e5ed;border-radius:20px;padding:16px;margin-bottom:14px}.hidden{display:none}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.grow{flex:1;min-width:0}
input,textarea,select{width:100%;border:1px solid #d5dbe5;border-radius:12px;padding:11px;background:white;min-height:44px}
textarea{min-height:130px;resize:vertical}.task,.subject{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #e0e5ed;border-radius:14px;margin-top:8px}
.task.done span{text-decoration:line-through;opacity:.5}.muted{color:#697386;font-size:14px}.bar{height:10px;background:#e7ebf2;border-radius:99px;overflow:hidden}.fill{height:100%;background:#172033;width:0}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:13px;border:1px solid #e0e5ed;border-radius:15px;text-align:center}.num{font-size:22px;font-weight:800}
.timer{font-size:42px;font-weight:800;text-align:center;margin:10px}.empty{text-align:center;padding:20px;color:#697386}
@media(max-width:520px){.tabs{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}.statgrid{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>📚 منظّم دراستي</h1>
    <p>رتّب دراستك وتابع إنجازك يومًا بيوم.</p>
  </section>

  <div class="tabs">
    <button class="tab" data-page="today">📅 اليوم</button>
    <button class="tab" data-page="subjects">📚 المواد</button>
    <button class="tab" data-page="tasks">✅ المهام</button>
    <button class="tab" data-page="notes">📝 الملاحظات</button>
  </div>

  <section id="today" class="panel page">
    <div class="row between"><div><h2>خطة اليوم</h2><p class="muted" id="todayDate"></p></div><button class="primary" id="quickTask">+ مهمة</button></div>
    <div class="statgrid">
      <div class="stat"><div class="num" id="totalStat">0</div><div class="muted">المهام</div></div>
      <div class="stat"><div class="num" id="doneStat">0</div><div class="muted">منجزة</div></div>
      <div class="stat"><div class="num" id="percentStat">0%</div><div class="muted">الإنجاز</div></div>
    </div>
    <div style="margin:14px 0" class="bar"><div class="fill" id="fill"></div></div>
    <div id="todayTasks"></div>
  </section>

  <section id="subjects" class="panel page hidden">
    <div class="row between"><h2>المواد الدراسية</h2><button class="primary" id="addSubject">+ مادة</button></div>
    <div id="subjectsList"></div>
  </section>

  <section id="tasks" class="panel page hidden">
    <h2>إضافة مهمة</h2>
    <form id="taskForm">
      <input id="taskText" placeholder="مثلاً: حل مسائل Logic Circuits" required>
      <div style="height:8px"></div>
      <select id="taskSubject"><option value="">بدون مادة</option></select>
      <div style="height:8px"></div>
      <button class="primary" style="width:100%">إضافة المهمة</button>
    </form>
    <div style="height:14px"></div><h2>كل المهام</h2><div id="allTasks"></div>
  </section>

  <section id="notes" class="panel page hidden">
    <h2>ملاحظاتي</h2>
    <textarea id="notesBox" placeholder="اكتب ملاحظاتك الدراسية هنا..."></textarea>
    <div style="height:8px"></div><button class="primary" id="saveNotes">حفظ الملاحظات</button>
    <p class="muted" id="noteStatus"></p>
  </section>

  <section class="panel">
    <h2>⏱️ مؤقت الدراسة</h2>
    <div class="timer" id="timer">50:00</div>
    <div class="row">
      <button class="primary grow" id="start">ابدأ</button>
      <button class="secondary" id="reset">إعادة</button>
    </div>
    <p class="muted" style="margin-top:10px;text-align:center">50 دقيقة دراسة — ثم خذ استراحة.</p>
  </section>
</div>

<script>
(() => {
const KEY="anas-study-v1";
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 subjects:["Logic Circuits","Physics","C++","Engineering Drawing"],
 tasks:[],
 notes:""
};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function render(){
 const total=state.tasks.length,done=state.tasks.filter(x=>x.done).length,p=total?Math.round(done/total*100):0;
 $("#totalStat").textContent=total;$("#doneStat").textContent=done;$("#percentStat").textContent=p+"%";$("#fill").style.width=p+"%";
 $("#todayDate").textContent=new Intl.DateTimeFormat("ar-IQ",{weekday:"long",year:"numeric",month:"long",day:"numeric"}).format(new Date());
 const taskHtml=state.tasks.length?state.tasks.map((x,i)=>`<div class="task ${x.done?"done":""}">
 <input type="checkbox" ${x.done?"checked":""} data-check="${i}" style="width:22px;height:22px">
 <span class="grow">${esc(x.text)}${x.subject?`<small class="muted"> · ${esc(x.subject)}</small>`:""}</span>
 <button class="secondary" data-del="${i}">حذف</button></div>`).join(""):`<div class="empty">ما عندك مهام بعد. أضف أول مهمة وابدأ 💪</div>`;
 $("#todayTasks").innerHTML=taskHtml;$("#allTasks").innerHTML=taskHtml;
 $("#subjectsList").innerHTML=state.subjects.length?state.subjects.map((s,i)=>`<div class="subject"><span class="grow">📘 ${esc(s)}</span><button class="secondary" data-subdel="${i}">حذف</button></div>`).join(""):`<div class="empty">أضف موادك الدراسية.</div>`;
 $("#taskSubject").innerHTML='<option value="">بدون مادة</option>'+state.subjects.map(s=>`<option>${esc(s)}</option>`).join("");
 $("#notesBox").value=state.notes;
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));$("#"+b.dataset.page).classList.remove("hidden")});
function addTask(){const text=$("#taskText").value.trim();if(!text)return;state.tasks.push({text,subject:$("#taskSubject").value,done:false});$("#taskText").value="";save();render();}
$("#taskForm").onsubmit=e=>{e.preventDefault();addTask()};
$("#quickTask").onclick=()=>{document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));$("#tasks").classList.remove("hidden");$("#taskText").focus()};
$("#addSubject").onclick=()=>{const s=prompt("اكتب اسم المادة:");if(s&&s.trim()){state.subjects.push(s.trim());save();render()}};
document.addEventListener("click",e=>{
 const c=e.target.closest("[data-check]");if(c){state.tasks[+c.dataset.check].done=c.checked;save();render();return}
 const d=e.target.closest("[data-del]");if(d){state.tasks.splice(+d.dataset.del,1);save();render();return}
 const sd=e.target.closest("[data-subdel]");if(sd){state.subjects.splice(+sd.dataset.subdel,1);save();render();}
});
$("#saveNotes").onclick=()=>{state.notes=$("#notesBox").value;save();$("#noteStatus").textContent="تم حفظ الملاحظات ✓";setTimeout(()=>$("#noteStatus").textContent="",1800)};
let secs=3000,timer=null;const clock=()=>{$("#timer").textContent=String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0")};
$("#start").onclick=()=>{if(timer)return;timer=setInterval(()=>{if(secs<=0){clearInterval(timer);timer=null;return}secs--;clock()},1000)};
$("#reset").onclick=()=>{clearInterval(timer);timer=null;secs=3000;clock()};
render();clock();
})();
</script>
</body>
</html>
